name: GTA IV Premium Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      performance_mode:
        description: "Smooth 40 FPS or test a 60 FPS ceiling (both preserve the same graphics and population)"
        required: true
        type: choice
        default: smooth
        options:
          - smooth
          - high

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: smooth
            label: Smooth 40 FPS
            slug: Smooth40
          - mode: high
            label: High 60 FPS
            slug: High60
    runs-on: windows-2022
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout premium patch
        uses: actions/checkout@v4
        with:
          path: premium
          persist-credentials: false
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: vaduur/LibertyRecompAndroid
          ref: 4f6ce516eb1cf606dadacaa63c5f63f00f751a55
          path: upstream
          persist-credentials: false
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install CMake and Ninja
        run: python -m pip install 'cmake>=3.29,<5' ninja
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default includes obsolete 'tools' package, removed from Google's repository.
          packages: 'platform-tools'
      - name: Normalize Android and Java paths for Git Bash
        run: |
          if [[ "${ANDROID_HOME:-}" =~ ^[A-Za-z]: ]]; then
            echo "ANDROID_HOME=$(cygpath -u "$ANDROID_HOME")" >> "$GITHUB_ENV"
          fi
          if [[ "${JAVA_HOME:-}" =~ ^[A-Za-z]: ]]; then
            echo "JAVA_HOME=$(cygpath -u "$JAVA_HOME")" >> "$GITHUB_ENV"
          fi
      - name: Install required SDK and NDK
        shell: pwsh
        run: |
          # PowerShell needs a native Windows JAVA_HOME; Git Bash steps use /c paths.
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:ANDROID_HOME = $env:ANDROID_SDK_ROOT
          $manager = Get-ChildItem -Path "$env:ANDROID_SDK_ROOT/cmdline-tools" -Filter sdkmanager.bat -Recurse -File | Select-Object -First 1
          if (-not $manager) { throw "sdkmanager.bat missing in $env:ANDROID_SDK_ROOT" }
          & $manager.FullName --sdk_root="$env:ANDROID_SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.14206865'
          if ($LASTEXITCODE -ne 0) { throw "SDK/NDK installation failed: $LASTEXITCODE" }
      - name: Force and verify NDK r29 for native CMake
        run: |
          set -euo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/29.0.14206865"
          test -f "$NDK_DIR/source.properties"
          grep -Fq 'Pkg.Revision = 29.0.14206865' "$NDK_DIR/source.properties"
          test -f "$NDK_DIR/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK=$(cygpath -m "$NDK_DIR")" >> "$GITHUB_ENV"
          echo "NDK_VER=29.0.14206865" >> "$GITHUB_ENV"
          echo "Pinned NDK at $(cygpath -m "$NDK_DIR")"
      - name: Verify upstream source anchors
        run: python premium/premium_patch/apply.py --root upstream --check-only
      - name: Apply camera settings and audio experiment
        run: python premium/premium_patch/apply.py --root upstream
      - name: Verify performance and audio source changes
        run: python premium/premium_patch/performance_v2.py --root upstream --mode "${{ matrix.mode }}" --check-only
      - name: Apply quality-preserving v2 performance and audio changes
        run: python premium/premium_patch/performance_v2.py --root upstream --mode "${{ matrix.mode }}"
      - name: Verify original visual quality and world population
        run: |
          set -euo pipefail
          f=upstream/os/android/app/src/main/assets/default_args.txt
          for flag in \
            '--gta4_output_height_cap=720' \
            '--gta4_native_upscaler=native' \
            '--gta4_native_anti_aliasing=fxaa' \
            '--gta4_draw_distance_scale=1.0' \
            '--gta4_dynamic_draw_distance=false' \
            '--gta4_shadow_map_base_size=256' \
            '--gta4_reflection_resolution=original' \
            '--gta4_traffic_density_scale=0.4' \
            '--gta4_parked_car_density_scale=0.4' \
            '--gta4_ped_density_scale=0.4' \
            '--gta4_scenario_ped_density_scale=0.4'; do
              grep -Fxq -- "$flag" "$f" || { echo "Refusing quality reduction: missing $flag"; exit 1; }
          done
      - name: Fetch upstream dependencies
        working-directory: upstream
        run: python tools/setup_repo.py
      - name: Build Vulkan driver proxy
        working-directory: upstream
        run: bash os/android/scripts/build_driver_proxy.sh
      - name: Build ARM64 native game engine
        working-directory: upstream
        env:
          STRIP: '1'
          BUILD_TYPE: Release
        run: |
          test -f "$ANDROID_NDK/source.properties"
          grep -Fq "Pkg.Revision = 29.0.14206865" "$ANDROID_NDK/source.properties"
          echo "Compiling with $ANDROID_NDK"
          bash os/android/scripts/build_native.sh 2
      - name: Build debug-signed APK
        working-directory: upstream
        run: bash os/android/scripts/build_apk.sh
      - name: Verify APK
        shell: pwsh
        run: |
          $apk = 'upstream/os/android/app/build/outputs/apk/debug/app-debug.apk'
          if (!(Test-Path $apk)) { throw 'APK not produced' }
          Get-Item $apk | Select-Object Name,Length
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Liberty-Premium-S23U-v2-${{ matrix.slug }}-APK
          path: upstream/os/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
